[theme]
# Màu chủ đạo (dùng cho các nút bấm, thanh trượt, loading...)
primaryColor = "#8bbcf4"

# Màu nền chính của toàn bộ trang
backgroundColor = "#FFFFFF"

# Màu nền phụ (dùng cho sidebar ở bên trái)
secondaryBackgroundColor = "#bacef6"

# Màu chữ
textColor = "#0b1447"

# Phông chữ (có thể chọn: "sans serif", "serif", "monospace")
font = "sans serif"